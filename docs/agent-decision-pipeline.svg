<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050"><defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#101626"/><stop offset="1" stop-color="#20384f"/></linearGradient></defs><rect width="1800" height="1050" fill="url(#back)"/><text x="72" y="90" fill="#f1f7ff" font-family="Segoe UI,Arial,sans-serif" font-size="43" font-weight="800" text-anchor="start">HOW THE CASCADE AGENT THINKS</text><text x="73" y="129" fill="#abc6df" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Faithful to the Python call path · search-tree numbers below are labels, not benchmark results</text><rect x="76" y="178" width="355" height="106" rx="18" fill="#203149" stroke="#607e9e" stroke-width="2"/><text x="98" y="220" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" text-anchor="start">Referee</text><text x="98" y="252" fill="#b6cadf" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Requests the next legal action</text><rect x="511" y="178" width="355" height="106" rx="18" fill="#203149" stroke="#607e9e" stroke-width="2"/><text x="533" y="220" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" text-anchor="start">Agent.action()</text><text x="533" y="252" fill="#b6cadf" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Reads the synced GameState</text><rect x="946" y="178" width="355" height="106" rx="18" fill="#203149" stroke="#607e9e" stroke-width="2"/><text x="968" y="220" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" text-anchor="start">legal_actions()</text><text x="968" y="252" fill="#b6cadf" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">PLACE / MOVE / EAT / CASCADE</text><path d="M437 230 L500 230" stroke="#6e9ec4" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M491 222 L500 230 L491 238" transform="rotate(0,500,230)" stroke="#6e9ec4" stroke-width="4" fill="none"/><path d="M872 230 L935 230" stroke="#6e9ec4" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M926 222 L935 230 L926 238" transform="rotate(0,935,230)" stroke="#6e9ec4" stroke-width="4" fill="none"/><rect x="1381" y="178" width="329" height="106" rx="18" fill="#344963" stroke="#9dc3e0" stroke-width="2"/><text x="1403" y="220" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">GamePhase</text><text x="1403" y="251" fill="#d8e5f6" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Placement or Play</text><path d="M1308 230 L1368 230" stroke="#6e9ec4" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M1359 222 L1368 230 L1359 238" transform="rotate(0,1368,230)" stroke="#6e9ec4" stroke-width="4" fill="none"/><path d="M1544 285 V331 H469 V370" stroke="#90b4d7" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M1544 285 V331 H1210 V370" stroke="#90b4d7" stroke-width="4" fill="none" stroke-linejoin="round"/><text x="277" y="363" fill="#94d6c9" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="710" text-anchor="start">PLACEMENT (first 8 turns)</text><text x="1116" y="363" fill="#ffcb92" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="710" text-anchor="start">PLAY PHASE</text><rect x="76" y="384" width="765" height="116" rx="18" fill="#193b44" stroke="#439d96" stroke-width="2"/><text x="98" y="426" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" text-anchor="start">Opening search</text><text x="98" y="458" fill="#b6cadf" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Position scoring + beam-limited lookahead</text><rect x="916" y="384" width="795" height="116" rx="18" fill="#4c3431" stroke="#df9a62" stroke-width="2"/><text x="938" y="426" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" text-anchor="start">Root tactical safety filters</text><text x="938" y="458" fill="#b6cadf" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Keep immediate wins; exclude obvious self-damage</text><path d="M1314 504 V560" stroke="#dfad81" stroke-width="4"/><rect x="916" y="570" width="795" height="116" rx="18" fill="#403737" stroke="#df9a62" stroke-width="2"/><text x="938" y="612" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" text-anchor="start">Iterative deepening</text><text x="938" y="644" fill="#b6cadf" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Depth 1 → 2 → 3 (subject to time budget)</text><path d="M1314 690 V742" stroke="#dfad81" stroke-width="4"/><rect x="916" y="751" width="795" height="124" rx="18" fill="#3b343c" stroke="#df9a62" stroke-width="2"/><text x="938" y="793" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" text-anchor="start">Negamax + α–β pruning</text><text x="938" y="825" fill="#b6cadf" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Move ordering · transposition cache · quiescence</text><rect x="75" y="570" width="765" height="116" rx="18" fill="#193b44" stroke="#439d96" stroke-width="2"/><text x="97" y="612" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" text-anchor="start">Evaluation &amp; terminal checks</text><text x="97" y="644" fill="#b6cadf" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Material · mobility · captures · risk · structure</text><path d="M470 504 V558" stroke="#72b9b2" stroke-width="4"/><path d="M470 690 V786 H906" stroke="#81a4c5" stroke-width="4" fill="none"/><path d="M1312 879 V921 H900" stroke="#b3b9d8" stroke-width="4" fill="none"/><path d="M470 690 V921 H900" stroke="#72b9b2" stroke-width="4" fill="none"/><rect x="530" y="910" width="740" height="95" rx="23" fill="#173e45" stroke="#75c9ba" stroke-width="3"/><text x="560" y="950" fill="#d9fff2" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="start">Return an Action to the referee</text><text x="560" y="979" fill="#b8dcd6" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">Best fully completed depth; greedy fallback on early timeout</text><rect x="78" y="734" width="730" height="108" rx="18" fill="#1f2940" stroke="#4f6285"/><text x="100" y="775" fill="#eff7ff" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="start">Simulation uses apply_action() / undo_action()</text><text x="100" y="811" fill="#b4c7e2" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">The real board is unchanged while candidates are scored.</text><text x="78" y="1033" fill="#9cb6cf" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">No neural model, prompt or LLM API is used in this game-playing agent.</text></svg>